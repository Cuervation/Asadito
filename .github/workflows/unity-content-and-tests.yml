name: Asadito content and Unity tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-validation:
    name: Validate authored content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate every food, six-state atlas, and level image
        run: python Tools/validate_food_content.py
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  unity-tests:
    name: Unity EditMode and PlayMode
    if: ${{ vars.UNITY_CI_LICENSE_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run Unity Test Runner
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.6.3f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload EditMode and PlayMode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
